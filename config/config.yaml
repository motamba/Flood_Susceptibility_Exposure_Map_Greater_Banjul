# Single source of truth for every pipeline parameter.
# Implementation Plan §4 (key parameters) and §5 (susceptibility model).
# Change values here, never inside the scripts.

project:
  name: flood-susceptibility-greater-banjul
  # Shown in the web map and README (ToR §9, §11)
  disclaimer: >-
    Susceptibility index for illustration and learning, not a validated flood
    forecast. Do not use for planning or safety decisions.

# --- Study area (ToR §3; Plan §4) -------------------------------------------
study_area:
  # geoBoundaries gbOpen GMB ADM2, pinned to a release commit for reproducibility.
  boundaries_url: https://github.com/wmgeolab/geoBoundaries/raw/9469f09/releaseData/gbOpen/GMB/ADM2/geoBoundaries-GMB-ADM2.geojson
  boundaries_source: geoBoundaries gbOpen GMB ADM2 (year represented 2020)
  boundaries_licence: CC BY 4.0
  name_field: shapeName
  # Banjul City Council + Kanifing Municipal Council + Kombo North/Saint Mary
  units:
    banjul: [Banjul Central, Banjul North, Banjul South]
    kanifing: [Bakau, Jeshwang, Serrekunda Central, Serrekunda East, Serrekunda West]
    kombo_north: [Kombo North]
  # Fallback if the boundaries are unsuitable (lon_min, lat_min, lon_max, lat_max)
  fallback_bbox: [-16.83, 13.25, -16.55, 13.50]
  gap_closing_m: 3000          # fills the Tanbi Wetland gap left by ADM2 units (Plan §5.3)
  hydrology_buffer_m: 2000     # avoid edge effects in flow routing (Plan §4)

# --- Data sources (ToR §4; Plan §5.1, §6, §7; checked 12 Nov 2026) ------------
# Cloud-optimised rasters are read remotely and clipped to the hydrology buffer
# (+ margin), so only the study-area window is downloaded.
data:
  clip_margin_deg: 0.05            # about 5.5 km, one CHIRPS pixel
  dem_primary: fabdem              # fabdem | copernicus (Plan §5.1)
  fabdem:
    url: /vsizip//vsicurl/https://data.bris.ac.uk/datasets/s5hqmjcdj8yo2ibzi9b4ew3sn/N10W020-N20W010_FABDEM_V1-2.zip/N13W017_FABDEM_V1-2.tif
    source: FABDEM V1-2, Hawker et al. (2022), University of Bristol
    licence: CC BY-NC-SA 4.0
  copernicus:
    url: /vsicurl/https://copernicus-dem-30m.s3.amazonaws.com/Copernicus_DSM_COG_10_N13_00_W017_00_DEM/Copernicus_DSM_COG_10_N13_00_W017_00_DEM.tif
    source: Copernicus DEM GLO-30, (c) DLR e.V. 2010-2014 and (c) Airbus Defence and Space GmbH 2014-2018, provided under COPERNICUS by the European Union and ESA
    licence: Copernicus DEM licence (free use with attribution)
  worldcover:
    url: /vsicurl/https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/ESA_WorldCover_10m_2021_v200_N12W018_Map.tif
    source: ESA WorldCover 10 m 2021 v200, Zanaga et al. (2022)
    licence: CC BY 4.0
  osm:
    url: https://download.geofabrik.de/africa/senegal-and-gambia-latest.osm.pbf
    source: OpenStreetMap contributors, extract by Geofabrik GmbH
    licence: ODbL 1.0
  chirps:
    monthly_url: https://data.chc.ucsb.edu/products/CHIRPS/v3.0/monthly/global/cogs/chirps-v3.0.{year}.{month:02d}.cog
    daily_url: https://data.chc.ucsb.edu/products/CHIRPS/v3.0/daily/final/{variant}/{year}/chirps-v3.0.{variant}.{year}.{month:02d}.{day:02d}.tif
    daily_variant: sat             # IMERG timing (rnl = ERA5 timing)
    monthly_years: [1991, 2025]    # complete years only
    nodata: -9999                  # present in files but not declared
    request_pause_s: 10            # server rate-limits (HTTP 429); be gentle
    source: CHIRPS v3.0, Climate Hazards Center UCSB; Funk et al. (2026) Sci Data 13, 718
    licence: Public domain (CC waiver); CC BY 4.0 attribution requested

# --- Coordinate systems (Plan §4) ---------------------------------------------
crs:
  processing: EPSG:32628       # WGS 84 / UTM zone 28N, metres
  web: EPSG:4326
resolution_m: 30

# --- Hydrology (Plan §5.3) ----------------------------------------------------
hydrology:
  stream_threshold_cells: 500  # tuned on Day 3 against OSM waterways

# --- Susceptibility factors and weights (Plan §5.2) ---------------------------
# direction: "low" = low values are more susceptible (inverted when normalised)
factors:
  hand:             {weight: 0.30, direction: low}
  elevation:        {weight: 0.20, direction: low}
  depression_depth: {weight: 0.20, direction: high}
  twi:              {weight: 0.15, direction: high}
  landcover:        {weight: 0.15, direction: high}
use_landcover: true            # if false, other weights are rescaled to sum to 1
normalisation_percentiles: [2, 98]

# --- Classification (Plan §5.4) ----------------------------------------------
classification:
  method: jenks                # jenks | quantiles
  n_classes: 3
  labels: [Low, Medium, High]
  jenks_sample_size: 50000
  random_seed: 42

# --- Rainfall (Plan §7) -------------------------------------------------------
rainfall:
  climatology_years: [1991, 2020]
  example_season_year: 2022
  example_season_months: [6, 10]   # June to October wet season
  heavy_rain_mm_per_day: 50    # to be justified from CHIRPS percentiles
